# Production environment specific configuration for Nginx

# Override settings for production environment
# This file is loaded as overrides.conf in production

server {
    listen 80;
    server_name ttpos.com api.ttpos.com;

    # Security headers (production)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Health check (minimal response)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Main API with strict rate limiting
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_conn conn_limit 5;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://main/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Production timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Enable caching for GET requests
        proxy_buffering on;
        proxy_cache_valid 200 5m;
    }

    # Block sensitive endpoints in production
    location ~ ^/(swagger|debug|pprof) {
        deny all;
        return 404;
    }

    # Block common attack patterns
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Block SQL injection attempts
    if ($args ~* "union.*select.*\(") {
        return 403;
    }

    # Block XSS attempts
    if ($args ~* "<script>") {
        return 403;
    }

    # Default: 404 for unmatched routes
    location / {
        return 404;
    }
}

# HTTPS redirect server
server {
    listen 80;
    server_name www.ttpos.com;
    return 301 https://ttpos.com$request_uri;
}
