# services/bmp-websocket/compose.yml
# Base configuration for BMP WebSocket Microservice

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - ttpos-network

services:
  bmp-websocket:
    <<: *common
    image: ${IMAGE_REGISTRY:-registry.example.com/your-org}/ttpos-bmp-websocket:${IMAGE_TAG:-latest}
    container_name: ttpos-bmp-websocket-${ENV:-local}
    hostname: bmp-websocket
    env_file:
      - ${ENV_FILE:-environments/${ENV:-local}/env}
    environment:
      - ENV=${ENV:-local}
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      - GRPC_PORT=14052
      - WS_PORT=14051
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.ttpos.service=bmp-websocket"
      - "com.ttpos.version=${IMAGE_TAG:-latest}"
      - "com.ttpos.environment=${ENV:-local}"
    networks:
      - ttpos-network

networks:
  ttpos-network:
    name: ttpos-${ENV:-local}
    external: true
