# Production US Region Ansible Inventory
# ansible/inventories/production-us/hosts.yml

all:
  vars:
    env: production
    deploy_path: /opt/ttpos/production
    git_repo: https://github.com/your-org/ttops-deploy.git
    git_branch: main
    image_registry: registry.example.com/your-org
    image_tag: ""  # Must be explicit

  children:
    app_servers:
      hosts:
        prod-app-1:
          ansible_host: prod-app-1.ttpos.internal
          ansible_user: deploy
          ansible_ssh_port: 22
          deploy_path: /opt/ttpos/production
          health_check_url: https://us.ttpos.com/health
          services:
            - main
            - nginx
          priority: 1

        prod-app-2:
          ansible_host: prod-app-2.ttpos.internal
          ansible_user: deploy
          ansible_ssh_port: 22
          deploy_path: /opt/ttpos/production
          health_check_url: https://us.ttpos.com/health
          services:
            - main
            - nginx
          priority: 2

    bmp_servers:
      hosts:
        prod-bmp-1:
          ansible_host: prod-bmp-1.ttpos.internal
          ansible_user: deploy
          ansible_ssh_port: 22
          deploy_path: /opt/ttpos/production
          health_check_url: https://bmp-us.ttpos.internal/health
          services:
            - php
            - bmp-erp
            - bmp-takeout
            - bmp-message
            - bmp-websocket
