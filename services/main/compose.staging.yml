# services/main/compose.staging.yml
# Staging environment overrides for Main Service

services:
  main:
    ports:
      - "${MAIN_HTTP_PORT:-8080}:8080"
    environment:
      - GIN_MODE=test
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_PPROF=${ENABLE_PPROF:-true}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-true}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '250m'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
