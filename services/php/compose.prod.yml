# services/php/compose.prod.yml
# Production environment overrides for PHP Service

services:
  php:
    ports: []
    environment:
      - PHP_ENV=production
      - PHP_DISPLAY_ERRORS=Off
      - PHP_ERROR_REPORTING=E_ALL & ~E_DEPRECATED & ~E_STRICT
      - OPCACHE_ENABLE=1
      - OPCACHE_VALIDATE_TIMESTAMPS=0
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '500m'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    labels:
      - "com.ttpos.service=php"
      - "com.ttpos.environment=production"
