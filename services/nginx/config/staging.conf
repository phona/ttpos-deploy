# Staging environment specific configuration for Nginx

# Override settings for staging environment
# This file is loaded as overrides.conf in staging

server {
    listen 80;
    server_name staging.ttpos.internal;

    # Debug headers (staging only)
    add_header X-Staging "true" always;
    add_header X-Debug "enabled" always;

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy (staging)\n";
        add_header Content-Type text/plain;
    }

    # Main API with debug logging
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://main/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Debug "true";
        proxy_set_header Connection "";

        # More permissive timeouts for debugging
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Enable debug logging
        access_log /var/log/nginx/staging_access.log main;
    }

    # Swagger UI (staging only)
    location /swagger/ {
        proxy_pass http://main/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Pprof endpoints (staging only)
    location /debug/pprof/ {
        proxy_pass http://main/debug/pprof/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Allow all methods for testing
    location / {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://main/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
