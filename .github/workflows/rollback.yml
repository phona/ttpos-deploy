name: Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rollback'
        required: true
        type: choice
        options:
          - main
          - php
          - bmp-erp
          - bmp-takeout
          - bmp-message
          - bmp-websocket
          - nginx
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - staging
          - production-us
          - production-eu
      previous_tag:
        description: 'Tag to rollback to (REQUIRED)'
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ github.event.inputs.service }}
      environment: ${{ github.event.inputs.environment }}
      previous_tag: ${{ github.event.inputs.previous_tag }}

    steps:
      - name: Validate inputs
        run: |
          TAG="${{ github.event.inputs.previous_tag }}"

          if [ -z "$TAG" ]; then
            echo "::error::Previous tag is required for rollback"
            exit 1
          fi

          # Validate tag format
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi

          echo "========================================"
          echo "⚠️  ROLLBACK Plan"
          echo "========================================"
          echo "Service: ${{ github.event.inputs.service }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Rollback to tag: $TAG"
          echo "========================================"

  rollback:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_US }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_EU }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Setup Ansible
        run: |
          pip install ansible

      - name: Determine inventory
        id: inventory
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ "$ENV" == "staging" ]; then
            echo "inventory=ansible/inventories/staging/hosts.yml" >> $GITHUB_OUTPUT
            echo "app_id=staging" >> $GITHUB_OUTPUT
          elif [ "$ENV" == "production-us" ]; then
            echo "inventory=ansible/inventories/production-us/hosts.yml" >> $GITHUB_OUTPUT
            echo "app_id=prod-us" >> $GITHUB_OUTPUT
          elif [ "$ENV" == "production-eu" ]; then
            echo "inventory=ansible/inventories/production-eu/hosts.yml" >> $GITHUB_OUTPUT
            echo "app_id=prod-eu" >> $GITHUB_OUTPUT
          fi

      - name: Rollback with Ansible
        run: |
          SERVICE="${{ github.event.inputs.service }}"
          ENV="${{ github.event.inputs.environment }}"
          TAG="${{ github.event.inputs.previous_tag }}"
          INVENTORY="${{ steps.inventory.outputs.inventory }}"
          APP_ID="${{ steps.inventory.outputs.app_id }}"

          ansible-playbook -i $INVENTORY \
            ansible/playbooks/rollback.yml \
            -e "service_name=$SERVICE" \
            -e "env=$ENV" \
            -e "tag=$TAG" \
            -e "app_id=$APP_ID" \
            -v

      - name: Run health check
        if: success()
        run: |
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh -s ${{ github.event.inputs.service }} -e ${{ github.event.inputs.environment }}

      - name: Notify success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x scripts/notify.sh
          ./scripts/notify.sh \
            --status rollback \
            --service "${{ github.event.inputs.service }}" \
            --env "${{ github.event.inputs.environment }}" \
            --tag "${{ github.event.inputs.previous_tag }}" || true

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x scripts/notify.sh
          ./scripts/notify.sh \
            --status rollback_failed \
            --service "${{ github.event.inputs.service }}" \
            --env "${{ github.event.inputs.environment }}" \
            --tag "${{ github.event.inputs.previous_tag }}" || true
