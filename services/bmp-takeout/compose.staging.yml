# services/bmp-takeout/compose.staging.yml
# Staging environment overrides for BMP Takeout Service

services:
  bmp-takeout:
    ports:
      - "${BMP_TAKEOUT_HTTP_PORT:-14030}:14030"
      - "${BMP_TAKEOUT_GRPC_PORT:-14032}:14032"
    environment:
      - GIN_MODE=test
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_PPROF=${ENABLE_PPROF:-true}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '250m'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
