name: Deploy Staging

on:
  # Trigger from other repos (ttpos-server-go CI completion)
  repository_dispatch:
    types: [deploy-staging]

  # Manual trigger
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - all
          - main
          - php
          - bmp-erp
          - bmp-takeout
          - bmp-message
          - bmp-websocket
          - nginx
      image_tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'
      dry_run:
        description: 'Dry run (show what would happen)'
        type: boolean
        default: false

env:
  ENVIRONMENT: staging
  REGISTRY: hub.hitosea.com/ttpos-server

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.set.outputs.service }}
      image_tag: ${{ steps.set.outputs.image_tag }}
      dry_run: ${{ steps.set.outputs.dry_run }}

    steps:
      - name: Set variables
        id: set
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "service=${{ github.event.client_payload.service }}" >> $GITHUB_OUTPUT
            echo "image_tag=${{ github.event.client_payload.tag || 'latest' }}" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          else
            echo "service=${{ inputs.service }}" >> $GITHUB_OUTPUT
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          fi

      - name: Display deployment info
        run: |
          echo "========================================"
          echo "Staging Deployment"
          echo "========================================"
          echo "Service: ${{ steps.set.outputs.service }}"
          echo "Image Tag: ${{ steps.set.outputs.image_tag }}"
          echo "Dry Run: ${{ steps.set.outputs.dry_run }}"
          echo "========================================"

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          SERVICE="${{ needs.prepare.outputs.service }}"
          ENV="staging"

          if [ "$SERVICE" == "all" ]; then
            SERVICES="main php bmp-erp bmp-takeout bmp-message bmp-websocket nginx"
          else
            SERVICES="$SERVICE"
          fi

          for svc in $SERVICES; do
            if [ -f "services/$svc/compose.yml" ]; then
              echo "Validating $svc..."
              docker compose -f "services/$svc/compose.yml" config --quiet

              if [ -f "services/$svc/compose.$ENV.yml" ]; then
                docker compose -f "services/$svc/compose.yml" -f "services/$svc/compose.$ENV.yml" config --quiet
              fi
            fi
          done

  deploy:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Setup Ansible
        run: |
          pip install ansible

      - name: Decrypt secrets
        if: ${{ secrets.SOPS_AGE_KEY != '' }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          chmod +x scripts/decrypt-secrets.sh
          ./scripts/decrypt-secrets.sh staging

      - name: Deploy with Ansible
        run: |
          SERVICE="${{ needs.prepare.outputs.service }}"
          TAG="${{ needs.prepare.outputs.image_tag }}"
          DRY_RUN="${{ needs.prepare.outputs.dry_run }}"

          EXTRA_VARS="service_name=$SERVICE env=staging tag=$TAG app_id=staging"

          if [ "$DRY_RUN" == "true" ]; then
            echo "[DRY RUN] Would deploy $SERVICE with tag $TAG to staging"
            ansible-playbook -i ansible/inventories/staging/hosts.yml \
              ansible/playbooks/deploy.yml \
              -e "$EXTRA_VARS" \
              --check \
              -v
          else
            ansible-playbook -i ansible/inventories/staging/hosts.yml \
              ansible/playbooks/deploy.yml \
              -e "$EXTRA_VARS" \
              -v
          fi

      - name: Run health check
        if: success() && needs.prepare.outputs.dry_run != 'true'
        run: |
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh -s ${{ needs.prepare.outputs.service }} -e staging

      - name: Notify success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x scripts/notify.sh
          ./scripts/notify.sh \
            --status success \
            --service "${{ needs.prepare.outputs.service }}" \
            --env "staging" \
            --tag "${{ needs.prepare.outputs.image_tag }}" || true

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x scripts/notify.sh
          ./scripts/notify.sh \
            --status failure \
            --service "${{ needs.prepare.outputs.service }}" \
            --env "staging" \
            --tag "${{ needs.prepare.outputs.image_tag }}" || true
