# services/main/compose.prod.yml
# Production environment overrides for Main Service
# Compatible with ttpos-server-go production setup

services:
  main:
    image: ${IMAGE_REGISTRY:-hub.hitosea.com/ttpos-server}/ttpos-server-go:${IMAGE_VERSION}
    container_name: saas-golang-${APP_ID:-prod}
    ports: []
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - ENABLE_PPROF=false
      - ENABLE_SWAGGER=false
      - GRPC_ENDPOINTS=${GRPC_ENDPOINTS}
    volumes:
      - ${DOCKER_PATH:-./docker}/certificate:/var/certificate:ro
      - ${LOG_PATH:-./docker/golang/logs}:/var/www/log
      - ${PUBLIC_PATH:-./admin/public}:/var/www/public:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '500m'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.ttpos.service=main"
      - "com.ttpos.version=${IMAGE_VERSION}"
      - "com.ttpos.environment=production"
      - "com.ttpos.critical=true"
