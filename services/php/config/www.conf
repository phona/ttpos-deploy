; PHP-FPM Pool Configuration for TTPOS

[www]
; Pool name
user = www-data
group = www-data

; Process Manager Settings
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Process Manager Settings (can be overridden)
; pm = ondemand
; pm.max_children = 50
; pm.process_idle_timeout = 10s
; pm.max_requests = 500

; Listen Settings
listen = 9000
listen.backlog = 511
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Allowed Clients
listen.allowed_clients = 127.0.0.1

; PHP-FPM Status Page
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Request Slowlog
slowlog = /var/log/php-fpm/slowlog-www.log
request_slowlog_timeout = 10s
request_terminate_timeout = 60s

; Environment Variables
clear_env = no

; Security
security.limit_extensions = .php .php3 .php4 .php5 .php7 .php8

; Catch worker output
catch_workers_output = yes
decorate_workers_output = no

; Access Log
access.log = /var/log/php-fpm/access-www.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"
