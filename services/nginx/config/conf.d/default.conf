# Default server configuration for TTPOS API Gateway

# Health check endpoint
server {
    listen 80;
    server_name localhost;

    # Health check endpoint (no rate limiting)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Status page
    location = /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # Main API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://main/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # BMP ERP gRPC-Web proxy
    location /grpc/erp/ {
        grpc_pass grpc://bmp_erp;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_connect_timeout 30s;
        grpc_read_timeout 60s;
    }

    # BMP Takeout gRPC-Web proxy
    location /grpc/takeout/ {
        grpc_pass grpc://bmp_takeout;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_connect_timeout 30s;
        grpc_read_timeout 60s;
    }

    # BMP Message gRPC-Web proxy
    location /grpc/message/ {
        grpc_pass grpc://bmp_message;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_connect_timeout 30s;
        grpc_read_timeout 60s;
    }

    # WebSocket endpoint
    location /ws/ {
        proxy_pass http://bmp_websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # PHP-FPM (for legacy endpoints)
    location ~ \.php$ {
        limit_req zone=api burst=20 nodelay;

        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_connect_timeout 30s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }

    # Default location
    location / {
        return 404;
    }
}
