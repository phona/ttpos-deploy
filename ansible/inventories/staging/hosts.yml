# Staging Environment Ansible Inventory
# ansible/inventories/staging/hosts.yml

all:
  vars:
    env: staging
    deploy_path: /opt/ttpos/staging
    git_repo: https://github.com/your-org/ttops-deploy.git
    git_branch: main
    image_registry: registry.example.com/your-org
    image_tag: latest

  hosts:
    staging-server-1:
      ansible_host: staging.ttpos.internal
      ansible_user: deploy
      ansible_ssh_port: 22
      deploy_path: /opt/ttpos/staging
      health_check_url: https://staging.ttpos.com/health
      services:
        - main
        - php
        - bmp-erp
        - bmp-takeout
        - bmp-message
        - bmp-websocket
        - nginx
