name: Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rollback'
        required: true
        type: choice
        options:
          - main
          - php
          - bmp-erp
          - bmp-takeout
          - bmp-message
          - bmp-websocket
          - nginx
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - staging
          - production
      previous_tag:
        description: 'Tag to rollback to'
        required: true

env:
  REGISTRY: registry.example.com/your-org
  GIT_REPO: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ github.event.inputs.service }}
      environment: ${{ github.event.inputs.environment }}
      previous_tag: ${{ github.event.inputs.previous_tag }}

    steps:
      - name: Validate inputs
        run: |
          TAG="${{ github.event.inputs.previous_tag }}"

          if [ -z "$TAG" ]; then
            echo "::error::Previous tag is required for rollback"
            exit 1
          fi

          # Validate tag format (basic check)
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi

          echo "Rollback Plan:"
          echo "  Service: ${{ github.event.inputs.service }}"
          echo "  Environment: ${{ github.event.inputs.environment }}"
          echo "  Rollback to tag: ${{ github.event.inputs.previous_tag }}"

  rollback:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_1 }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_2 }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rollback
        env:
          GIT_REPO: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          chmod +x scripts/rollback.sh
          ./scripts/rollback.sh \
            "${{ github.event.inputs.service }}" \
            "${{ github.event.inputs.environment }}" \
            "${{ github.event.inputs.previous_tag }}"

      - name: Run health check
        if: success()
        run: |
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh -s ${{ github.event.inputs.service }} -e ${{ github.event.inputs.environment }}

      - name: Notify success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x scripts/notify.sh
          ./scripts/notify.sh \
            --status rollback \
            --service "${{ github.event.inputs.service }}" \
            --env "${{ github.event.inputs.environment }}" \
            --tag "${{ github.event.inputs.previous_tag }}" || true

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x scripts/notify.sh
          ./scripts/notify.sh \
            --status rollback_failed \
            --service "${{ github.event.inputs.service }}" \
            --env "${{ github.event.inputs.environment }}" \
            --tag "${{ github.event.inputs.previous_tag }}" || true
