# Production EU Region Ansible Inventory
# ansible/inventories/production-eu/hosts.yml

all:
  vars:
    env: production
    deploy_path: /opt/ttpos/production
    git_repo: https://github.com/your-org/ttops-deploy.git
    git_branch: main
    image_registry: registry.example.com/your-org
    image_tag: ""  # Must be explicit

  children:
    app_servers:
      hosts:
        prod-eu-app-1:
          ansible_host: prod-eu-app-1.ttpos.internal
          ansible_user: deploy
          ansible_ssh_port: 22
          deploy_path: /opt/ttpos/production
          health_check_url: https://eu.ttpos.com/health
          services:
            - main
            - nginx
          priority: 1

    bmp_servers:
      hosts:
        prod-eu-bmp-1:
          ansible_host: prod-eu-bmp-1.ttpos.internal
          ansible_user: deploy
          ansible_ssh_port: 22
          deploy_path: /opt/ttpos/production
          health_check_url: https://bmp-eu.ttpos.internal/health
          services:
            - php
            - bmp-erp
            - bmp-takeout
            - bmp-message
            - bmp-websocket
