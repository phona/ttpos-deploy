; Supervisor Configuration for PHP-FPM

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=10
stdout_logfile=/var/log/supervisor/php-fpm-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/php-fpm-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
user=root

[eventlistener:process_exit]
command=bash -c "echo 'Process exited'"
events=PROCESS_STATE_EXITED
buffer_size=100
