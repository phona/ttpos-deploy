# services/bmp-takeout/compose.yml
# Base configuration for BMP Takeout Microservice
# Compatible with production deployment from ttpos-server-go

x-common: &common
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - bmp-network

services:
  bmp-takeout:
    <<: *common
    image: ${IMAGE_REGISTRY:-hub.hitosea.com/ttpos-server}/ttpos-server-takeout:${IMAGE_VERSION:-latest}
    container_name: ttpos-bmp-takeout-${APP_ID:-dev}
    hostname: bmp-takeout
    environment:
      - GRPC_ENDPOINTS=${GRPC_ENDPOINTS:-}:14032
    volumes:
      - ${CONFIG_PATH:-./app/ttpos-takeout/manifest/config}:/app/config
      - ${LOG_PATH:-./docker/bmp-takeout/logs}:/app/log
    ports:
      - "14031:14031"
      - "14032:14032"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:14032"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.ttpos.service=bmp-takeout"
      - "com.ttpos.version=${IMAGE_VERSION:-latest}"
      - "com.ttpos.environment=${ENV:-local}"
    networks:
      bmp-network:
        ipv4_address: ${BMP_TAKEOUT_IP:-10.0.10.40}

networks:
  bmp-network:
    name: bmp-network-${APP_ID:-dev}
    driver: bridge
    ipam:
      config:
        - subnet: ${BMP_NETWORK_SUBNET:-10.0.10.0/24}
          gateway: ${BMP_NETWORK_GATEWAY:-10.0.10.1}
