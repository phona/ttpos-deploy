# services/bmp-takeout/compose.prod.yml
# Production environment overrides for BMP Takeout Service
# Compatible with ttpos-server-go production setup

services:
  bmp-takeout:
    image: ${IMAGE_REGISTRY:-hub.hitosea.com/ttpos-server}/ttpos-server-takeout:${IMAGE_VERSION}
    container_name: ttpos-bmp-takeout-${APP_ID:-prod}
    ports: []
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - GRPC_ENDPOINTS=${GRPC_ENDPOINTS}:14032
    volumes:
      - ${CONFIG_PATH:-./app/ttpos-takeout/manifest/config}:/app/config:ro
      - ${LOG_PATH:-./docker/bmp-takeout/logs}:/app/log
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '250m'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:14032"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.ttpos.service=bmp-takeout"
      - "com.ttpos.version=${IMAGE_VERSION}"
      - "com.ttpos.environment=production"
