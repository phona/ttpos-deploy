# services/nginx/compose.yml
# Base configuration for Nginx API Gateway

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - ttpos-network

services:
  nginx:
    <<: *common
    image: nginx:alpine
    container_name: ttpos-nginx-${ENV:-local}
    hostname: nginx
    env_file:
      - ${ENV_FILE:-environments/${ENV:-local}/env}
    environment:
      - ENV=${ENV:-local}
      - NGINX_HOST=${NGINX_HOST:-localhost}
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.ttpos.service=nginx"
      - "com.ttpos.environment=${ENV:-local}"
    networks:
      - ttpos-network
    depends_on:
      - main

volumes:
  nginx-logs:
    name: ttpos-nginx-logs-${ENV:-local}

networks:
  ttpos-network:
    name: ttpos-${ENV:-local}
    external: true
