# services/nginx/compose.yml
# Base configuration for Nginx API Gateway
# Compatible with production deployment from ttpos-server-go

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - saas-network

services:
  nginx:
    <<: *common
    image: nginx:alpine
    container_name: saas-nginx-${APP_ID:-dev}
    hostname: nginx
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "${NGINX_PORT:-}:80"
      - "${NGINX_SSL_PORT:-}:443"
    volumes:
      - ${DOCKER_PATH:-./docker}/sysctl/nginx.conf:/etc/nginx/nginx.conf
      - ${DOCKER_PATH:-./docker}/nginx:/etc/nginx/conf.d
      - ${PUBLIC_PATH:-./admin/public}:/var/www/public
      - ${DOCS_PATH:-./docs}:/var/www/docs
      - ${MAIN_DOCS_PATH:-./main/docs}:/var/www/main/docs/
    links:
      - php
      - golang
    depends_on:
      - php
      - golang
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "ttpos-takeout:${SERVER_IP:-127.0.0.1}"
      - "ttpos-websocket:${SERVER_IP:-127.0.0.1}"
    labels:
      - "com.ttpos.service=nginx"
      - "com.ttpos.environment=${ENV:-local}"
    networks:
      saas-network:
        ipv4_address: ${NGINX_IP:-10.0.0.11}

networks:
  saas-network:
    name: saas-network-${APP_ID:-dev}
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.0.0.0/24}
          gateway: ${NETWORK_GATEWAY:-10.0.0.1}
