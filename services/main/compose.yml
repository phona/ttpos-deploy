# services/main/compose.yml
# Base configuration for TTPOS Main Service (Go + Gin)
# Compatible with production deployment from ttpos-server-go

x-common: &common
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - saas-network

services:
  main:
    <<: *common
    image: ${IMAGE_REGISTRY:-hub.hitosea.com/ttpos-server}/ttpos-server-go:${IMAGE_VERSION:-latest}
    container_name: saas-golang-${APP_ID:-dev}
    hostname: golang
    env_file:
      - ${ENV_FILE:-../../environments/${ENV:-staging}/env}
    environment:
      - GRPC_ENDPOINTS=${GRPC_ENDPOINTS:-}
    volumes:
      - ./i18n:/var/www/i18n
      - ${ENV_FILE:-.env}:/var/.env
      - ${CERT_PATH:-./docker/certificate}:/var/certificate
      - ${LOG_PATH:-./logs}:/var/www/log
      - ${PUBLIC_PATH:-./public}:/var/www/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.ttpos.service=main"
      - "com.ttpos.version=${IMAGE_VERSION:-latest}"
      - "com.ttpos.environment=${ENV:-local}"
    networks:
      saas-network:
        ipv4_address: ${MAIN_IP:-10.0.0.18}

networks:
  saas-network:
    name: saas-network-${APP_ID:-dev}
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.0.0.0/24}
          gateway: ${NETWORK_GATEWAY:-10.0.0.1}
