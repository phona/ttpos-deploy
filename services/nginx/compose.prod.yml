# services/nginx/compose.prod.yml
# Production environment overrides for Nginx
# Compatible with ttpos-server-go production setup

services:
  nginx:
    image: ${IMAGE_REGISTRY:-hub.hitosea.com/ttpos-server}/ttpos-server-nginx:${IMAGE_VERSION:-latest}
    container_name: saas-nginx-${APP_ID:-prod}
    ports:
      - "${NGINX_PORT:-}:80"
      - "${NGINX_SSL_PORT:-}:443"
    volumes:
      - ${DOCKER_PATH:-./docker}/sysctl/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DOCKER_PATH:-./docker}/nginx:/etc/nginx/conf.d:ro
    environment:
      - ENV=production
    extra_hosts:
      - "ttpos-takeout:${SERVER_IP}"
      - "ttpos-websocket:${SERVER_IP}"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '100m'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.ttpos.service=nginx"
      - "com.ttpos.environment=production"
